# 项目相关配置
zhian:
  # 名称
  name: zhian-gateway
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2024
  # 实例演示开关
  demoEnabled: true
  # 基础路径，用于存放文件和日志(与存放JAR包的目录一致)
  basePath: ${zhian.basic.path:/home/zhian/firemonitor}
  # 文件路径 示例（ Windows配置D:/firemonitor/uploadPath，Linux配置 /home/firemonitor/uploadPath）
  profile: ${zhian.basePath}/upload
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math
  disruptor:
    threads: 10
    bufferSize: 1048576
  # 消息环境
  message:
    env: -dev
  cache:
    mode: REDIS

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: ${zhian.server.port:8080}
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# websocket 配置
websocket:
  path: /ws/{userId}
  port: ${zhian.websocket.port:8081}
  bossLoopGroupThreads: 1
  workerLoopGroupThreads: 5

# 日志配置
logging:
  level:
    com.zhian: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  jackson:
    time-zone: Asia/Shanghai
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      # 主库数据源
      master:
        url: jdbc:mysql://${zhian.mysql.host:192.168.1.196}:${zhian.mysql.port:3306}/${zhian.mysql.dbname:zhian_gateway}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
        username: ${zhian.mysql.username:root}
        password: ${zhian.mysql.password:Pa33w0rd}
      # 从库数据源
      slave:
        # 从数据源开关/默认关闭
        enabled: false
        url:
        username:
        password:
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: zhian
        login-password: 123456
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true

  # active 基础 配置
  jms:
    listener:
      # 默认开启多少个消费者
      concurrency: 1
      #在这里消费者是可以随动的。最大配置消费者并行最大数量
      max-concurrency: 3
    # 默认使用单连接缓存连接工厂 - CachingConnectionFactory
    cache:
      enabled: true

  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: dev

  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size:  100MB
      # 设置总上传的文件大小
      max-request-size:  200MB

  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true

  # redis 配置
  redis:
    # 地址
    host: ${zhian.redis.host:192.168.1.196}
    # 端口，默认为6379
    port: ${zhian.redis.port:6379}
    # 数据库索引
    database: ${zhian.redis.database:0}
    # 密码
    password: ${zhian.redis.password:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 1440

# MyBatis配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.zhian.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/mysql/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml
  type-handlers-package: com.zhian.framework.datasource.mp

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# license授权
license:
  subject: ccx-models
  publicAlias: publicCert
  storePass: public_Pa33w0rd2024
  licensePath: ${zhian.basePath}/license/license.lic
  publicKeysStorePath: ${zhian.basePath}/license/publicCerts.keystore

# 推送配置
unipush:
  appId: laPG2fCzh98hswzAgQgYG
  appKey: Kxf1OEmj8e7ZLBcZdG7H79
  masterSecret: WE1B9zDWuv6ryFvTO2jrs6
  domain: https://restapi.getui.com/v2/
  appPackage: com.jbewt.zhian

